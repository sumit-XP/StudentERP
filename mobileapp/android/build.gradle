// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext {
        buildToolsVersion = "33.0.0"
        minSdkVersion = 21
        compileSdkVersion = 34
        targetSdkVersion = 34

        // We use NDK 23 which has both M1 support and is the side-by-side NDK version from AGP.
        ndkVersion = "23.1.7779620"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        // Force newer R8/D8 to fix kotlin.H error with Firebase Auth 22.3+
        classpath("com.android.tools:r8:8.2.33")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force "androidx.core:core:1.9.0"
            force "androidx.core:core-ktx:1.9.0"
            force "androidx.appcompat:appcompat:1.6.1"
            force "androidx.appcompat:appcompat-resources:1.6.1"
            force "androidx.annotation:annotation-experimental:1.3.0"
        }
    }
}
allprojects { tasks.configureEach { task -> if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) { task.kotlinOptions.jvmTarget = "11" } } }  